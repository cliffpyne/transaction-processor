{% extends "home.html" %}
{% block content %}
<div class="kt-container-fixed" id="contentContainer">

 <div class="flex items-center flex-wrap justify-between gap-3 mb-5">
  <div>
   <h1 class="text-xl font-semibold text-mono">Field Collections</h1>
   <span class="text-sm text-secondary-foreground" id="col_datelbl">Today's agents & officers</span>
  </div>
  <div class="flex items-center gap-2">
   <select id="col_role" class="kt-select" style="width:150px">
    <option value="all">All</option>
    <option value="agent">Agents</option>
    <option value="officer">Officers</option>
   </select>
   <input type="text" id="col_search" class="kt-input" style="width:200px" placeholder="Search name…">
   <button class="kt-btn kt-btn-outline" id="col_refresh"><i class="ki-filled ki-arrows-circle"></i> Refresh</button>
  </div>
 </div>

 <!-- KPI tiles -->
 <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-5">
  <div class="kt-card"><div class="kt-card-content p-5">
   <div class="text-2sm text-secondary-foreground mb-1">Total customers</div>
   <div class="text-2xl font-semibold text-mono" id="kpi_total">—</div></div></div>
  <div class="kt-card"><div class="kt-card-content p-5">
   <div class="text-2sm text-secondary-foreground mb-1">Passed</div>
   <div class="text-2xl font-semibold" id="kpi_passed">—</div></div></div>
  <div class="kt-card"><div class="kt-card-content p-5">
   <div class="text-2sm text-secondary-foreground mb-1">Overall %</div>
   <div class="text-2xl font-semibold" id="kpi_pct">—</div></div></div>
  <div class="kt-card"><div class="kt-card-content p-5">
   <div class="text-2sm text-secondary-foreground mb-1">People working</div>
   <div class="text-2xl font-semibold text-mono" id="kpi_people">—</div></div></div>
 </div>

 <!-- Agents / officers table -->
 <div class="kt-card"><div class="kt-card-content p-0"><div class="kt-scrollable-x-auto">
  <table class="kt-table kt-table-border align-middle text-sm w-full">
   <thead><tr class="text-secondary-foreground">
    <th class="text-start py-2.5 ps-5">Name</th><th>Role</th>
    <th class="text-end">Total</th><th class="text-end">Passed</th><th class="text-end pe-5">%</th>
   </tr></thead>
   <tbody id="col_body"><tr><td colspan="5" class="text-center p-4 text-secondary-foreground"><span class="kt-spinner"></span> loading…</td></tr></tbody>
  </table>
 </div></div></div>

</div>
<script src="/static/collections_page.js" defer></script>
{% endblock %}
